<!--
Guards the direction that broke first.

The self-link fix started out as "ignore any link that is a sub-path of
this page's url". That is wrong, and it took board detection down with it:
on a Greenhouse board EVERY posting is a sub-path of the board's own url,
so all 50 of them vanished and a board classified as "unknown".

The rule keys on the posting ID instead. This board's url carries an id of
its own, which is the case most likely to make an id-based rule
over-exclude - the postings below all carry DIFFERENT ids and must still
be counted.

No apply wording on purpose: this stays a board on its link count, not by
failing some other test.
-->
