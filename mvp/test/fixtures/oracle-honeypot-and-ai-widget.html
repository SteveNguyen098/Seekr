<!doctype html>
<!--
BUG (two of them, both from Oracle HCM Cloud postings):

1. A honeypot must never be filled. Every geometry check reports it as
   perfectly visible - it hides via a height:0, overflow:hidden ANCESTOR, so
   its own box is a normal 199x38. Only the name gives it away.

2. Oracle Digital Assistant mounts an unrelated AI-assistant widget in a
   background dialog, whose textarea was otherwise discovered as a REQUIRED
   field of the application. Scoped to the "oda-" component prefix rather than
   its copy: the visible instruction text drifts, the component prefix does
   not.

Both must be reported as deliberate skips with distinct reasons - not as
failures, and not as each other. The honeypot label is reserved for controls
actually named like one, because aria-hidden overwhelmingly marks ordinary
widget plumbing and calling that "anti-bot honeypot" is alarming and wrong.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Oracle - honeypot and AI-assistant widget</title>
    <style>
      .trap-ancestor { height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div class="trap-ancestor">
      <label for="hp">Leave this field blank</label>
      <input id="hp" name="honeypot" type="text" style="width: 199px; height: 38px" />
    </div>

    <div id="oda-chat-dialog" class="oda-dialog-container">
      <label for="oda-work-summary-text-area">Summarize your work experience</label>
      <textarea id="oda-work-summary-text-area" required></textarea>
    </div>

    <form>
      <label for="real-email">Email</label>
      <input id="real-email" name="email" type="email" required />
    </form>
  </body>
</html>
