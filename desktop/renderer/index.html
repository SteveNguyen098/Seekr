<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Seekr</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Seekr</h1>
      <span class="sub">auto-apply &mdash; stops before submit, always</span>
    </header>

    <section class="form">
      <div class="field">
        <span
          >Paste up to 5 links &mdash; job postings or careers pages, either works. Seekr fills
          them one at a time and leaves each browser window open for you to review.</span
        >
        <div id="links"></div>
        <button id="addLink" class="ghost small addLink">+ Add another link</button>
      </div>

      <div class="actions">
        <button id="run" class="primary">Run</button>
        <button id="stop" class="ghost" disabled>Stop</button>
        <button id="reset" class="ghost" title="Close out this batch - including every browser window still open for review - and start over with new links. No need to quit the app.">New run</button>
        <span id="status" class="status">Idle</span>
      </div>

      <div class="settingRow">
        <span class="lbl">Resume template</span>
        <span id="resume" class="val">…</span>
        <button id="pick" class="ghost small">Change…</button>
      </div>
    </section>

    <section id="pause" class="pause hidden">
      <div>
        <strong>Waiting on you.</strong>
        <p id="pauseMsg"></p>
      </div>
      <button id="continue" class="primary">Continue</button>
    </section>

    <!-- One card is appended here per link, as each finishes filling. -->
    <div id="results"></div>

    <section class="log">
      <h2>Output</h2>
      <pre id="log"></pre>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
